name: Post PR validation comment

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
    validation-comment:
        runs-on: ubuntu-latest

        steps:
        - name: Download artifact from the analysis run
          uses: actions/download-artifact@v4
          with:
            name: pr-comment
            run-id: ${{ github.event.workflow_run.id }}
            github-token: ${{ secrets.GITHUB_TOKEN }}

        - name: Setup R
          uses: r-lib/actions/setup-r@v2

        - name: Install gh package
          run: Rscript -e 'install.packages("gh")'

        - name: Post comment on PR
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            R -e 'body <- readLines("comment.txt")
                  pr_number <- readLines("pr_number.txt")
                  repo_parts <- strsplit(Sys.getenv("GITHUB_REPOSITORY"), "/")[[1]]

                  gh::gh("POST /repos/{owner}/{repo}/issues/{issue_number}/comments",
                         owner = repo_parts[1], repo = repo_parts[2],
                         issue_number = pr_number, body = body)'
