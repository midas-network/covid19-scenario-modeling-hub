license: "mit"
methods: "We applied a data driven model based on Fourier series to retrofit historical COVID-19 seasonality and project the baseline scenario for both hospitalization and death. Then a mechanistic model is applied to further simulate all the other scenarios."
methods_long: "We first used three years historical data (2022-2025) to fit a Fourier series model with annual, biannual, and monthly harmonic terms to track the strong seasonality of COVID-19. Then we calibrated it to the latest data, as the baseline scenario assuming no changes in vaccination policy. Once this scenario was achieved, we further simulated hospitalization and death reduction via vaccination, as well as waning immuity and other important mechanisms. In each scenario, 300 samples was generated to generate the final dataset."
